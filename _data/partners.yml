- name: Nandos
  type: org
  link: "https://www.nandos.co.uk/"
  description: |
    <p><a href="https://www.nandos.co.uk/" target="_blank">Nando's</a> is famous for its flame-grilled PERi-PERi and with over 500 restaurants across the UK and Ireland, and more than 20,000 Nandocas (that's what they call employees), it is committed to creating exceptional experiences for both its people and customers. Tech and engineering is at the heart of how they make this happen. The drive to deliver seamless, innovative and unique products through diverse perspectives and collaboration is what sets them apart.</p>
  image:
    path: "/assets/images/partners/Nandos.png"
    alt: Nando’s logo
  page_show: true

- name: Re:Build
  type: org
  link: "https://rebuildcon.uk/"
  description: |
    <p><a href="https://rebuildcon.uk" target="_blank">Re:Build</a> is a new two-day developer conference on 5 & 6 May 2027 at the Business Design Centre in Islington, London. It's built around the developer as a person rather than the latest technology trend, and looks at three questions: what we build, how we build it, and who we become in an industry being reshaped by AI.</p>
    <p>Short stage talks lead into roundtables and The Conversation, a new 90-minute format where the room works through the questions that matter together. Re:Build is proud to partner with Women Coding Community and is committed to a welcoming event for everyone, guided by its Code of Respect. Find out more at <a href="https://rebuildcon.uk" target="_blank">rebuildcon.uk</a>.</p>
  image:
    path: "/assets/images/partners/rebuild.png"
    alt: Re:Build logo
  page_show: true

